plugins { id 'net.fabricmc.fabric-loom' version '1.18.2' }
version = '1.0.0'
group = 'exnihiloauto'
base { archivesName = 'exnihilo-automation-fabric-26.3' }
repositories { maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.160.7+26.3'
    if (findProject(':omnia') != null) implementation project(':omnia')
    else implementation files('libs/exnihiloomnia-fabric-26.3-0.5.0-alpha.3-jei.jar')
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
fabricApi { configureTests { createSourceSet = true; modId = 'exnihiloauto-test'; enableGameTests = true; enableClientGameTests = false } }
jar { from('LICENSE.md') }
